name: Release Native macOS GUI

# Builds the declared SwiftUI product for Apple Silicon, signs and notarizes it
# when Apple credentials are configured, and attaches a zip to the matching
# GitHub Release. Windows and Linux ship the CLI only.

on:
  push:
    tags: ['v[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build GUI binaries for (e.g. v4.3.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-gui:
    name: Build native SwiftUI GUI — aarch64-apple-darwin
    runs-on: macos-latest
    env:
      RESOLVED_TAG: ${{ inputs.tag || github.ref_name }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify native bundle version matches release tag
        shell: bash
        run: |
          set -euo pipefail
          want="${RESOLVED_TAG#v}"
          actual="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -1)"
          if [ "$actual" != "$want" ]; then
            echo "::error::workspace version '$actual' does not match tag '$RESOLVED_TAG'"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hp41-gui/hp41-bridge -> hp41-gui/hp41-bridge/target

      - run: rustup default stable

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Build native application bundle
        run: just gui-build

      - name: Verify bundle architecture, version, and privacy manifest
        shell: bash
        run: |
          set -euo pipefail
          APP="hp41-gui/.build/HP-41 Calculator.app"
          test -x "$APP/Contents/MacOS/hp41-gui"
          test -f "$APP/Contents/Resources/PrivacyInfo.xcprivacy"
          test "$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")" = "${RESOLVED_TAG#v}"
          lipo -verify_arch arm64 "$APP/Contents/MacOS/hp41-gui"
          plutil -lint "$APP/Contents/Info.plist" "$APP/Contents/Resources/PrivacyInfo.xcprivacy"

      - name: Import Apple Developer certificate
        if: ${{ env.APPLE_CERTIFICATE != '' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Sign native application bundle
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP="hp41-gui/.build/HP-41 Calculator.app"
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package application
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT="hp41-gui-${RESOLVED_TAG}-aarch64-apple-darwin.zip"
          ditto -c -k --sequesterRsrc --keepParent "hp41-gui/.build/HP-41 Calculator.app" "$ARTIFACT"
          echo "ARTIFACT_PATH=$ARTIFACT" >> "$GITHUB_ENV"

      - name: Notarize and staple native application
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_PASSWORD != '' && env.APPLE_TEAM_ID != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="hp41-gui/.build/HP-41 Calculator.app"
          xcrun notarytool submit "$ARTIFACT_PATH" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ARTIFACT_PATH"

      - name: Upload native GUI to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: ${{ env.ARTIFACT_PATH }}
          fail_on_unmatched_files: true
