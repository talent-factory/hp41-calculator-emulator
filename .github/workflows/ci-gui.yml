name: ci-gui

on:
  push:
    branches: [main, develop]
    paths:
      - 'hp41-gui/**'
      - 'hp41-core/**'
      - 'scripts/swiftui-parity.py'
      - 'docs/swiftui-parity.json'
      - 'Justfile'
      - '.github/workflows/ci-gui.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'hp41-gui/**'
      - 'hp41-core/**'
      - 'scripts/swiftui-parity.py'
      - 'docs/swiftui-parity.json'
      - 'Justfile'
      - '.github/workflows/ci-gui.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Native SwiftUI GUI
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hp41-gui/hp41-bridge -> hp41-gui/hp41-bridge/target

      # See ci.yml: macOS-latest occasionally leaves cargo proxying to rustup-init
      # AFTER Swatinem/rust-cache restores ~/.cargo/bin/. Running rustup default
      # stable POST cache-restore rebinds the cargo proxy.
      - run: rustup default stable

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install Xcode project generator
        run: gem install xcodeproj --no-document

      - name: Native GUI CI and rendered smoke tests
        run: just gui-ci

  sanitizer:
    name: Swift/FFI ${{ matrix.sanitizer }} sanitizer
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [thread, address]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hp41-gui/hp41-bridge -> hp41-gui/hp41-bridge/target

      - run: rustup default stable

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run sanitizer suite
        run: just gui-sanitize-${{ matrix.sanitizer }}
