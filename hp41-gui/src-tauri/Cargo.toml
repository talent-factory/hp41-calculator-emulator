[workspace]
resolver = "2"

[package]
name = "hp41-gui"
version = "4.3.0"
edition = "2021"
rust-version = "1.88"

[[bin]]
name = "hp41-gui"
path = "src/main.rs"

[lib]
name = "hp41_gui_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.11", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hp41-core = { path = "../../hp41-core" }
hp41-app = { path = "../hp41-app" }
dirs = "6"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-haptics = "2.3.2"

# Desktop-only: a single-instance guard so a second launch surfaces the running
# app instead of spawning a duplicate tray icon (the crate is desktop-only).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# macOS-only: global hotkey to toggle the menu-bar popover. Uses Carbon
# RegisterEventHotKey under the hood, so no Accessibility permission is required.
# The feature is macOS-only (menu-bar mode is macOS-only — ADR-v4.1-001).
[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
rust_decimal = "1.42"
tempfile = "3"


[build-dependencies]
tauri-build = { version = "2.6", features = [] }
